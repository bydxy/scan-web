<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="浏览器实时扫码：二维码 / 条形码本地识别，数据不出设备" />
    <title>Scan · 极速扫码</title>
  </head>
  <body>
    <div id="app">
      <!-- 首屏 -->
      <section id="home-view" class="view view--active">
        <header class="hero">
          <h1 class="hero__title">Scan</h1>
          <p class="hero__subtitle">极速扫码 · 本地识别 · 数据不出设备</p>
        </header>
        <button id="btn-start" class="glass-btn glass-btn--primary">开始扫描</button>
        <div class="home-actions">
          <button id="btn-history" class="glass-btn">扫一扫记录</button>
          <label id="btn-upload" class="glass-btn">
            相册识别
            <input id="file-input" type="file" accept="image/*" hidden />
          </label>
        </div>
      </section>

      <!-- 扫描视图 -->
      <section id="scan-view" class="view">
        <video
          id="camera"
          autoplay
          muted
          playsinline
          disablepictureinpicture
        ></video>
        <canvas id="frame-buffer" hidden></canvas>

        <div id="viewfinder" class="viewfinder">
          <div class="viewfinder__mask"></div>
          <div class="viewfinder__window">
            <span class="corner corner--tl"></span>
            <span class="corner corner--tr"></span>
            <span class="corner corner--bl"></span>
            <span class="corner corner--br"></span>
            <div class="scanline"></div>
          </div>
          <p id="scan-hint" class="viewfinder__hint">对准二维码 / 条形码</p>
        </div>

        <header class="topbar">
          <button id="btn-back" class="glass-pill" aria-label="返回">←</button>
          <span id="engine-badge" class="engine-badge"></span>
          <button id="btn-torch" class="glass-pill" aria-label="闪光灯" hidden>⚡</button>
        </header>

        <footer class="dock">
          <button id="btn-flip" class="glass-pill" aria-label="切换镜头">🔄</button>
          <button id="btn-pause" class="glass-btn glass-btn--small">暂停</button>
        </footer>
      </section>

      <!-- 结果底部 Sheet -->
      <div id="result-sheet" class="sheet" hidden>
        <div class="sheet__backdrop"></div>
        <div class="sheet__panel glass-panel">
          <div class="sheet__grabber"></div>
          <p id="result-type" class="sheet__type"></p>
          <p id="result-text" class="sheet__text"></p>
          <div class="sheet__actions">
            <button id="btn-copy" class="glass-btn">复制</button>
            <a id="btn-open" class="glass-btn glass-btn--primary" target="_blank" rel="noopener" hidden>打开链接</a>
            <button id="btn-rescan" class="glass-btn">继续扫描</button>
          </div>
        </div>
      </div>

      <!-- 历史 -->
      <div id="history-sheet" class="sheet" hidden>
        <div class="sheet__backdrop"></div>
        <div class="sheet__panel glass-panel">
          <div class="sheet__grabber"></div>
          <p class="sheet__type">最近扫描</p>
          <ul id="history-list" class="history-list"></ul>
          <div class="sheet__actions">
            <button id="btn-history-close" class="glass-btn">关闭</button>
          </div>
        </div>
      </div>

      <!-- 权限引导 -->
      <div id="perm-sheet" class="sheet" hidden>
        <div class="sheet__backdrop"></div>
        <div class="sheet__panel glass-panel">
          <div class="sheet__grabber"></div>
          <p id="perm-title" class="sheet__type">需要相机权限</p>
          <p id="perm-desc" class="sheet__text"></p>
          <div class="sheet__actions">
            <button id="btn-perm-retry" class="glass-btn glass-btn--primary">重试</button>
            <button id="btn-perm-close" class="glass-btn">关闭</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
